[ai]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"

[commit]
style = "conventional"
max_diff_lines = 300

[ignore]
patterns = [
    "*.lock",
    "*.min.js",
    "*.min.css",
    "package-lock.json",
    "yarn.lock",
    "composer.lock",
    "*.generated.*",
    "__pycache__/",
    ".env",
]
